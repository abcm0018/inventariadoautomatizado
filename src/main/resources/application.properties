# ===================================
# APPLICATION NAME
# ===================================
spring.application.name=inventario-automatizado

# Desactivar el reinicio en caliente de DevTools
# spring.devtools.restart.enabled=false

# ===================================
# DATABASE CONFIGURATION
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:inventario_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA/HIBERNATE CONFIGURATION
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===================================
# SWAGGER/OPENAPI CONFIGURATION
# ===================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ===================================
# LOGGING CONFIGURATION
# ===================================
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.abcm0018.sai=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===================================
# JWT CONFIGURATION
# ===================================
jwt.secret.key=${JWT_SECRET_KEY}
jwt.access-token.expiration=3600000
jwt.refresh-token.expiration=604800000

# ===================================
# EMAIL CONFIGURATION
# ===================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

# Email remitente oficial
app.email.from-address=${EMAIL_FROM_ADDRESS:noreply@abcm0018.com}
app.email.from-name=${EMAIL_FROM_NAME:Sistema de Inventario}

# Alertas
app.email.alerts.send-to=${EMAIL_ALERTS_RECIPIENT:admin@abcm0018.com}

# Logging de emails (util para debugging)
logging.level.com.abcm0018.sai.email=DEBUG

# ===================================
# RABBITMQ CONFIGURATION
# ===================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=/

# Conexion automatica
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.requested-heartbeat=60

# Configuracion del Listener (para recibir mensajes)
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# configuracion de colas
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# Connection Pool
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=10

# Retry Strategy
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# Publisher Confirmations
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Logging de RabbitMQ (util para debugging)
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.amqp.rabbit=DEBUG

# ========================================
# REDIS CONFIGURATION
# ========================================

# Conexion basica a Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# Pool de conexiones Lettuce (recomendado sobre Jedis)
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# Timeout de conexion
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# ========================================
# CACHE CONFIGURATION
# ========================================

# Habilitar cache
spring.cache.type=redis

# Prefijo para todas las claves de cache
spring.cache.redis.key-prefix=inventario:

# Usar prefijo en las claves
spring.cache.redis.use-key-prefix=true

# TTL por defecto (sobreescrito por RedisCacheConfig)
spring.cache.redis.time-to-live=1800000

# No cachear valores null
spring.cache.redis.cache-null-values=false

# ========================================
# LOGGING PARA REDIS (opcional, para debugging)
# ========================================

# Nivel de log para Redis
logging.level.org.springframework.data.redis=INFO
logging.level.io.lettuce.core=INFO

# Log de operaciones de cache
logging.level.org.springframework.cache=DEBUG

# ========================================
# ACTUATOR ENDPOINTS (para monitorear cache)
# ========================================

# Habilitar endpoint de cache en Actuator
management.endpoint.caches.enabled=true
management.endpoints.web.exposure.include=health,info,caches,metrics

# Mostrar detalles de Redis en health check
management.endpoint.health.show-details=always


# =========================================
# Configuracion de WebSocket y CORS
# =========================================

# ------------------------------------------
# CORS - Origenes Permitidos
# ------------------------------------------
# En desarrollo (multiples origenes separados por coma)
allowed.origins=http://localhost:8000,http://localhost:3000,http://127.0.0.1:8000

# ===============================================
# --- Configuracion de Almacenamiento (Storage) ---
# ===============================================

# Ubicacion donde se guardaran los archivos de importacion
# Por defecto (si no se define) es: /tmp/imports
# storage.location=/var/data/sai/imports

# Tam. maximo permitido en bytes
# Por defecto (si no se define) es: 10485760 (10MB)
# storage.max-size-in-bytes=10485760

# Extensiones permitidas (separadas por coma)
# Por defecto (si no se define) es: lista vacia (ninguna)
# storage.allowed-types=csv,xlsx

# ===================================
# SERVER CONFIGURATION
# ===================================
server.port=${SERVER_PORT:8080}