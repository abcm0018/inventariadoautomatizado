<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Palets (Chart.js + AG Grid)</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.1/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.1/styles/ag-theme-alpine.css">

    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 20px auto; padding: 20px; background: #6e6a6a; }
        .status { padding: 15px; margin-bottom: 20px; border-radius: 8px; font-weight: bold; text-align: center; }
        .connected { background: #4caf50; color: white; }
        .disconnected { background: #f44336; color: white; }

        .charts-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .chart-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            height: 400px;
            position: relative;
        }
        .chart-box h3 { margin: 0 0 15px 0; color: #333; text-align: center; }

        /* --- ¡NUEVO! Estilos para la tabla --- */
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .table-container h3 { margin: 0 0 15px 0; color: #333; }
        /* Damos una altura fija a la tabla para que tenga scroll */
        #myGrid {
            height: 500px;
            width: 100%;
        }
        /* --- FIN DE ESTILOS --- */

        .login-form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        .login-form input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .login-form button { padding: 8px 12px; background: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<h1>🚀 Dashboard de Palets en Tiempo Real (Chart.js + AG Grid)</h1>

<div class="login-form">
    <input type="text" id="username" placeholder="Nº Empleado" value="1000">
    <input type="password" id="password" placeholder="Contraseña" value="Samira2010?">
    <button id="loginButton">Login y Conectar</button>
</div>

<div id="status" class="status disconnected">
    🔴 Desconectado
</div>

<h2>Total de Palets: <span id="count">0</span></h2>

<div class="charts-container">
    <div class="chart-box">
        <h3>Palets por Empleado</h3>
        <canvas id="employeeChart"></canvas>
    </div>
    <div class="chart-box">
        <h3>Palets por Marca</h3>
        <canvas id="brandChart"></canvas>
    </div>
</div>

<div class="table-container">
    <h3>Últimos Palets Escaneados</h3>
    <div id="myGrid" class="ag-theme-alpine"></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.1/dist/ag-grid-community.min.js"></script>

<script>
    // --- 1. REFERENCIAS AL DOM ---
    const statusDiv = document.getElementById('status');
    const countSpan = document.getElementById('count');
    const loginButton = document.getElementById('loginButton');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    // --- 2. ESTADO Y CONFIGURACIÓN ---
    let paletCount = 0;
    let stompClient = null;

    const PALETS_STORAGE_KEY = 'persistedPalets';
    const TOKEN_STORAGE_KEY = 'jwtToken';

    let allPalets = [];
    let processedPaletIds = new Set();

    // Chart.js
    let employeeChart = null;
    let brandChart = null;
    const CHART_COLORS = ['#4CAF50', '#2196F3', '#FFC107', '#F44336', '#9C27B0', '#009688', '#FF9800', '#795548', '#607D8B', '#E91E63'];

    // --- ¡NUEVO! Variables para AG-Grid ---
    let gridApi = null;
    const columnDefs = [
        { field: "sscc", headerName: "SSCC", width: 220, pinned: 'left' },
        { field: "productName", headerName: "Producto", width: 250 },
        { field: "brand", headerName: "Marca", width: 150, sortable: true, filter: true },
        { field: "employeeName", headerName: "Empleado", width: 200, sortable: true, filter: true },
        { field: "batchNumber", headerName: "Lote", width: 120 },
        { field: "scannedAt", headerName: "Fecha Escaneo", width: 150, sortable: true },
        { field: "gtin", headerName: "GTIN", width: 150 },
        { field: "isExpired", headerName: "Caducado", width: 110, cellStyle: params => params.value ? {backgroundColor: '#f44336', color: 'white'} : undefined }
    ];

    // --- 3. FUNCIONES DE PERSISTENCIA (sessionStorage) ---

    function loadFromSession() {
        const storedPalets = sessionStorage.getItem(PALETS_STORAGE_KEY);
        if (storedPalets) {
            console.log('Restaurando palets desde sessionStorage...');
            allPalets = JSON.parse(storedPalets);
            allPalets.forEach(palet => processedPaletIds.add(palet.sscc));
            paletCount = allPalets.length;
            countSpan.textContent = paletCount;
        }

        // Inicializa gráficas Y la tabla
        initializeCharts();
        initializeGrid(); // <-- ¡NUEVO!

        const storedToken = sessionStorage.getItem(TOKEN_STORAGE_KEY);
        if (storedToken) {
            console.log('Token JWT encontrado. Intentando reconexión automática...');
            connectWithToken(storedToken);
        }
    }

    function saveToSession() {
        try {
            sessionStorage.setItem(PALETS_STORAGE_KEY, JSON.stringify(allPalets));
        } catch (e) { console.error("Error al guardar en sessionStorage:", e); }
    }

    // --- 4. LÓGICA DE AUTENTICACIÓN Y CONEXIÓN ---

    loginButton.addEventListener('click', loginAndConnect);

    async function loginAndConnect() {
        statusDiv.className = 'status disconnected';
        statusDiv.textContent = '🟡 Autenticando...';

        sessionStorage.clear();
        allPalets = [];
        processedPaletIds.clear();
        paletCount = 0;
        countSpan.textContent = '0';

        // Limpia gráficas Y tabla
        initializeCharts();
        if (gridApi) {
            gridApi.setRowData([]); // <-- ¡NUEVO! Limpia la tabla
        }

        if (stompClient && stompClient.active) {
            await stompClient.deactivate();
        }

        try {
            const response = await fetch('http://localhost:8080/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    employeeNumber: usernameInput.value,
                    password: passwordInput.value
                })
            });
            // --- FIN DE LA CORRECCIÓN ---

            if (!response.ok) {
                throw new Error('Login fallido. Revisa credenciales.');
            }

            const data = await response.json();
            const jwtToken = data.data.token;
            if (!jwtToken) {
                throw new Error('Respuesta de login no contiene token.');
            }

            sessionStorage.setItem(TOKEN_STORAGE_KEY, jwtToken);
            connectWithToken(jwtToken);

        } catch (error) {
            // ... (Manejo de error es el mismo) ...
            statusDiv.textContent = `❌ ${error.message}`;
        }
    }

    async function connectWithToken(token) {
        // ... (Lógica de new StompJs.Client es la misma) ...
        // ... (onConnect, onStompError, etc. son iguales) ...

        if (stompClient && stompClient.active) {
            await stompClient.deactivate();
        }

        statusDiv.textContent = '🟡 Autenticado. Conectando a WebSocket...';
        const stompHeaders = { 'Authorization': 'Bearer ' + token };

        stompClient = new StompJs.Client({
            webSocketFactory: () => new SockJS('http://localhost:8080/wssai'),
            connectHeaders: stompHeaders,

            onConnect: (frame) => {
                console.log('✅ Conectado y AUTENTICADO al WebSocket');
                statusDiv.className = 'status connected';
                statusDiv.textContent = '✅ Conectado y Autenticado';

                // 1. Suscribirse a novedades (actualización individual)
                stompClient.subscribe('/topic/palets', (message) => {
                    const palet = JSON.parse(message.body);
                    console.log('📨 (WS) Nuevo palet recibido:', palet.sscc);
                    addPaletAndUpdateChartsAndGrid(palet); // <-- Nombre de función actualizado
                });

                // 2. Cargar historial (actualización en batch)
                fetchHistoricalPalets(token);
            },
            onStompError: (frame) => {
                console.error('❌ Error STOMP:', frame.headers['message']);
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = '❌ Error de Autenticación STOMP. Token rechazado.';
                sessionStorage.clear();
                allPalets = [];
                initializeCharts();
                if(gridApi) gridApi.setRowData([]);
            },
            onWebSocketClose: (event) => {
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = '🔴 Desconectado';
            },
            debug: (str) => { /* console.log('🐛 Debug:', str) */ },
        });

        stompClient.activate();
    }

    async function fetchHistoricalPalets(token) {
        console.log('Cargando palets históricos (REST)...');
        try {
            // --- ¡AQUÍ ESTÁ LA CORRECCIÓN! ---
            // Añadimos el 'Authorization: Bearer ...' al header del fetch.
            const response = await fetch('http://localhost:8080/api/v1/palets/recent-100', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            // --- FIN DE LA CORRECCIÓN ---

            if (!response.ok) {
                // Esto ahora mostrará "No se pudo cargar..." por el 403 si el token es malo
                throw new Error('No se pudo cargar el historial.');
            }

            const responseData = await response.json();
            const historicalPalets = responseData.data;
            if (!historicalPalets) {
                throw new Error("La API no devolvió 'data'.");
            }

            console.log(`(REST) Cargados ${historicalPalets.length} palets históricos.`);

            let paletsAdded = 0;
            historicalPalets.forEach(palet => {
                if (!processedPaletIds.has(palet.sscc)) {
                    processedPaletIds.add(palet.sscc);
                    allPalets.unshift(palet);
                    paletsAdded++;
                }
            });

            if (paletsAdded > 0) {
                paletCount = allPalets.length;
                countSpan.textContent = paletCount;
                saveToSession();

                // Actualiza gráficas Y tabla con el batch completo
                initializeCharts();
                if (gridApi) {
                    gridApi.setRowData(allPalets);
                }
            }

        } catch (e) {
            console.error("Error cargando historial:", e.message);
            statusDiv.textContent = `❌ Error al cargar historial: ${e.message}`;
        }
    }


    // --- 5. LÓGICA DE GRÁFICAS Y TABLA ---

    // (Helper getChartData es el mismo)
    function getChartData() {
        const employeeCounts = {};
        const brandCounts = {};
        allPalets.forEach(palet => {
            const emp = palet.employeeName || 'Desconocido';
            const brand = palet.brand || 'Desconocida';
            employeeCounts[emp] = (employeeCounts[emp] || 0) + 1;
            brandCounts[brand] = (brandCounts[brand] || 0) + 1;
        });
        return { employeeCounts, brandCounts };
    }

    // (initializeCharts es el mismo)
    function initializeCharts() {
        if (employeeChart) employeeChart.destroy();
        if (brandChart) brandChart.destroy();
        const { employeeCounts, brandCounts } = getChartData();
        const empCtx = document.getElementById('employeeChart').getContext('2d');
        employeeChart = new Chart(empCtx, { /* ... (configuración de chart) ... */ });
        const brandCtx = document.getElementById('brandChart').getContext('2d');
        brandChart = new Chart(brandCtx, { /* ... (configuración de chart) ... */ });
    }

    /**
     * --- ¡NUEVA FUNCIÓN! ---
     * Inicializa la tabla de AG Grid por primera vez.
     */
    function initializeGrid() {
        if (gridApi) {
            gridApi.destroy(); // Destruye si ya existe
        }

        const gridDiv = document.getElementById('myGrid');

        // Crea la tabla y guarda la API para futuras actualizaciones
        gridApi = agGrid.createGrid(gridDiv, {
            columnDefs: columnDefs,
            rowData: allPalets, // Carga los datos iniciales de sessionStorage
            defaultColDef: {
                sortable: true,
                filter: true,
                resizable: true
            },

            // --- ¡AQUÍ ESTÁ LA CORRECCIÓN! ---
            // Le decimos a AG Grid que 'sscc' es el ID de la fila.
            // Esto es VITAL para que applyTransaction funcione correctamente.
            getRowId: (params) => params.data.sscc,
            // --- FIN DE LA CORRECCIÓN ---

            ensureDomOrder: true,
        });
    }

    /**
     * --- ¡FUNCIÓN ACTUALIZADA! ---
     * Función central para añadir un palet (de WS) y actualizar todo.
     */
    function addPaletAndUpdateChartsAndGrid(palet) {
        // 1. Control de Duplicados
        if (processedPaletIds.has(palet.sscc)) {
            console.warn(`(UI) Palet duplicado omitido: ${palet.sscc}`);
            return;
        }
        processedPaletIds.add(palet.sscc);

        // 2. Actualizar contador
        paletCount++;
        countSpan.textContent = paletCount;

        // 3. Añadir al array de estado
        allPalets.unshift(palet);

        // 4. Persistir
        saveToSession();

        // 5. Actualizar Gráficas (Incremental)
        updateChartsWithNewPalet(palet);

        // 6. ¡NUEVO! Actualizar Tabla (Incremental)
        if (gridApi) {
            // Usa 'applyTransaction' para añadir la fila eficientemente
            // 'addIndex: 0' la añade al principio de la tabla
            gridApi.applyTransaction({
                add: [palet],
                addIndex: 0
            });
        }
    }

    /**
     * (Función de Chart.js sin cambios)
     * Actualiza las gráficas existentes con 1 palet nuevo (de WebSocket).
     */
    function updateChartsWithNewPalet(palet) {
        if (!employeeChart || !brandChart) return;

        // 1. Actualizar Gráfica de Empleados
        const emp = palet.employeeName || 'Desconocido';
        let empIndex = employeeChart.data.labels.indexOf(emp);
        if (empIndex === -1) {
            employeeChart.data.labels.push(emp);
            employeeChart.data.datasets[0].data.push(1);
        } else {
            employeeChart.data.datasets[0].data[empIndex]++;
        }
        employeeChart.update();

        // 2. Actualizar Gráfica de Marcas
        const brand = palet.brand || 'Desconocida';
        let brandIndex = brandChart.data.labels.indexOf(brand);
        if (brandIndex === -1) {
            brandChart.data.labels.push(brand);
            brandChart.data.datasets[0].data.push(1);
        } else {
            brandChart.data.datasets[0].data[brandIndex]++;
        }
        brandChart.update();
    }


    // --- 6. INICIO Y CIERRE ---

    window.addEventListener('beforeunload', () => {
        if (stompClient && stompClient.active) {
            stompClient.deactivate();
        }
    });

    // ¡PUNTO DE ENTRADA!
    loadFromSession();

</script>
</body>
</html>
